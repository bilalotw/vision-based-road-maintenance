[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "road-distress-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "opencv-python", "torch", "torchvision", "scikit-learn", "PyYAML"]
[tool.setuptools.packages.find]
where = ["src"]
